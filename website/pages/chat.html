<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="chat.css" />
    <title>Chat</title>
  </head>

  <body>
    <div id="chatCard">
      <div id="headerDiv">
        <div id="titleDiv">
          <img id="iconImg" src="/website/images/icon.png" />
          <h1>WazzApp</h1>
        </div>
        <div id="userPanelDiv">
          <img id="profileImg" src="/website/images/profile_default.svg" />
          <div id="nameDiv"></div>
          <button id="logOutButton">Log Out</button>
        </div>
      </div>

      <div id="messagesDiv"></div>
      <div id="composerDiv">
        <input id="messageInput" placeholder="Type a message" />
        <button id="sendButton">Send</button>
      </div>
    </div>

    <script type="module" src="chat.js"></script>
  </body>
</html>
