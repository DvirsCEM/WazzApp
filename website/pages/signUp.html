<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="signUp.css" />
    <title>Sign Up</title>
  </head>
  <body>
    <h1>Sign Up</h1>
    <input id="usernameInput" placeholder="Enter a username" />
    <input id="passwordInput" type="password" placeholder="Enter a password" />
    <input id="confirmInput" type="password" placeholder="Enter the password again" />
    <input id="imageInput" placeholder="Enter a profile picture URL" />
    <img id="profileImg" src="/website/images/profile_default.svg"/>
    <button id="submitButton">Submit</button>
    <div id="errorDiv"></div>

    <script type="module" src="signUp.js"></script>
  </body>
</html>
